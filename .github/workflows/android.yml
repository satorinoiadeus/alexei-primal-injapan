name: Android APK build
on:
  workflow_dispatch:
env:
  ANDROID_NDK_HOME: ""
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Create signing keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          test -n "$ANDROID_KEYSTORE" || { echo "Set ANDROID_KEYSTORE repository secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > android.keystore
      - name: Install Ren'Py and Android SDK
        uses: Ayowel/renpy-setup-action@v3
        with:
          action: install
          dlc: rapt
          android_sdk: true
          android_properties: |
            key.alias=android
            key.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            key.alias.password=${{ secrets.ANDROID_ALIAS_PASSWORD }}
            key.store=${{ github.workspace }}/android.keystore
      - name: Build APK
        uses: Ayowel/renpy-setup-action@v3
        with:
          action: android_build
          build_type: apk
          out_dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: Alexei-Android-APK
          path: dist/**/*.apk
          if-no-files-found: error
